<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <!-- Left lens -->
  <circle cx="210" cy="155" r="120" fill="rgba(200,220,240,0.10)" stroke="#222" stroke-width="7"/>
  <!-- Right lens -->
  <circle cx="590" cy="155" r="120" fill="rgba(200,220,240,0.10)" stroke="#222" stroke-width="7"/>
  <!-- Bridge -->
  <path d="M330 130 Q400 90 470 130" stroke="#222" stroke-width="6" fill="none"/>
  <!-- Left temple -->
  <line x1="90" y1="145" x2="0" y2="155" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <!-- Right temple -->
  <line x1="710" y1="145" x2="800" y2="155" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <!-- Nose pads -->
  <ellipse cx="330" cy="185" rx="6" ry="10" stroke="#555" stroke-width="2" fill="none" transform="rotate(-15 330 185)"/>
  <ellipse cx="470" cy="185" rx="6" ry="10" stroke="#555" stroke-width="2" fill="none" transform="rotate(15 470 185)"/>
</svg>
