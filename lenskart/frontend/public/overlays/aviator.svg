  <path d="M210 50 C320 50 330 150 310 230 C295 280 125 280 110 230 C90 150 100 50 210 50Z" fill="rgba(120,90,50,0.18)" stroke="#8B7355" stroke-width="5"/>
  <!-- Right lens (teardrop) -->
  <path d="M590 50 C700 50 710 150 690 230 C675 280 505 280 490 230 C470 150 480 50 590 50Z" fill="rgba(120,90,50,0.18)" stroke="#8B7355" stroke-width="5"/>
