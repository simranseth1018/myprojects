  <!-- Nose pads -->
  <ellipse cx="355" cy="120" rx="6" ry="10" stroke="#8B7355" stroke-width="2" fill="none" transform="rotate(-10 355 120)"/>
  <ellipse cx="445" cy="120" rx="6" ry="10" stroke="#8B7355" stroke-width="2" fill="none" transform="rotate(10 445 120)"/>
