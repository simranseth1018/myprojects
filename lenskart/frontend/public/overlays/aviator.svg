  <path d="M340 80 Q400 50 460 80" stroke="#8B7355" stroke-width="5" fill="none"/>
  <!-- Left temple -->
  <line x1="85" y1="55" x2="0" y2="70" stroke="#8B7355" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Right temple -->
